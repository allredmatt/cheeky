<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&family=Karantina:wght@300;400;700&family=Michroma&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto&family=Ubuntu+Mono&display=swap"
      rel="stylesheet"
    />
    <title>Cheeky</title>
  </head>
  <body>
    <header class="container mt-4 mb-4">
      <div class="d-flex align-items-end justify-content-evenly">
        <div id="logo">
          <h1 id="logo-text">CHEEKY</h1>
        </div>
        <aside id="login" >
          <button class="btn" id="button-login" onclick="toggleHidden()"><b>Log In</b></button>
        </aside>
        <aside id="logged-in" class="text-end" hidden>
          <button class="btn mt-2" id="button-login" >
            <img src="./resources/user.svg" alt="User Icon" width="24px" />
          </button>
          <p class="p-1 mt-2"><b>Joe Bloggs</b></p>
          <p class="p-1 mb-0">E17 3WW</p>
        </aside>
      </div>
      <hr class="border-2" />
    </header>
    <main>
      <section
        class="container d-flex flex-nowrap"
        id="card-container-noscroll"
      >
        <!-- Card start -->
        <div
          class="card mx-1 primary-background card-min-width"
          style="width: 12rem"
        >
          <img src="./resources/burgers.jpeg" class="card-img-top" alt="..." />
          <div class="card-body">
            <p class="card-text text-font-michroma">American</p>
          </div>
        </div>
        <!-- Card End -->
        <!-- Card start -->
        <div
          class="card mx-1 primary-background card-min-width"
          style="width: 12rem"
        >
          <img src="./resources/indian.jpeg" class="card-img-top" alt="..." />
          <div class="card-body">
            <p class="card-text text-font-michroma">Indian</p>
          </div>
        </div>
        <!-- Card End -->
        <!-- Card start -->
        <div
          class="card mx-1 primary-background card-min-width"
          style="width: 12rem"
        >
          <img src="./resources/pizza.jpeg" class="card-img-top" alt="..." />
          <div class="card-body">
            <p class="card-text text-font-michroma">Italian</p>
          </div>
        </div>
        <!-- Card End -->
        <!-- Card start -->
        <div
          class="card mx-1 primary-background card-min-width"
          style="width: 12rem"
        >
          <img src="./resources/noodles.jpeg" class="card-img-top" alt="..." />
          <div class="card-body">
            <p class="card-text text-font-michroma">Chinese</p>
          </div>
        </div>
        <!-- Card End -->
        <!-- Card start -->
        <div
          class="card mx-1 primary-background card-min-width"
          style="width: 12rem"
        >
          <img src="./resources/thai.jpg" class="card-img-top" alt="..." />
          <div class="card-body">
            <p class="card-text text-font-michroma">Thai</p>
          </div>
        </div>
        <!-- Card End -->
      </section>

      <section class="container">
        <hr class="border-2" />
        <h2>Featured and Offers</h2>
        <!-- Rest Card Start -->
        <div class="card mb-3 primary-background text-font-michroma d-flex">
          <div class="row g-0">
            <div class="col-md-4">
              <img
                src="./resources/nandos.jpg"
                class="img-fluid rounded-start"
                alt="Nando's Icon"
                width="150px"
              />
            </div>
            <div class="col-md-8">
              <div class="card-body">
                <h5 class="card-title">Nando's</h5>
                <p class="card-text">
                  20% for new customers to this restaurant
                </p>
              </div>
            </div>
          </div>
        </div>
        <!-- Rest Card End -->
        <!-- Rest Card Start -->
        <div class="card mb-3 primary-background text-font-michroma d-flex">
          <div class="row g-0">
            <div class="col-md-4">
              <img
                src="./resources/starbucks.webp"
                class="img-fluid rounded-start"
                alt="Starbucks Logo"
                width="150px"
              />
            </div>
            <div class="col-md-8">
              <div class="card-body">
                <h5 class="card-title">Starbucks</h5>
                <p class="card-text">
                  Every 5th coffee for free.
                </p>
              </div>
            </div>
          </div>
        </div>
        <!-- Rest Card End -->
      </section>
    </main>
    <script src="./resources/src/script.js" type="text/javascript"></script>
  </body>
</html>
